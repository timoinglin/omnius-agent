# Omnius — core settings.
#
# Every key is optional and commented out below, showing its default. An
# untouched file behaves exactly like no file at all: uncomment a line to
# change something.
#
# Precedence: environment variable > this file > default.
#
# Secrets are NOT here — the Discord token and ids live in the root .env.
# See config\README.md.

[backup]

# WHERE THIS INSTANCE PUTS ITS BACKUPS. Set this — it is the one setting with
# no sensible default, and Omnius will keep complaining until it has a value.
#
# Every install backs itself up separately. The git repo carries the SYSTEM
# (code, skills, docs); your notes, projects and media live on this disk and
# nowhere else. Point this at something that is not this disk: an external
# drive, a second internal disk, or a NAS you control.
#
# ⚠ NOT a consumer cloud folder. Since 2026-09-01 the backup zip is the WHOLE
# workspace as it stands, which means it contains your `.env`, your saved
# browser sessions and any key file in the tree (docs\BACKUP.md). That is what
# makes it able to restore you — and what makes OneDrive/Dropbox/Drive the
# wrong destination: you would be handing every secret this machine holds to a
# third party, and to anyone that folder is ever shared with. A NAS or a drive
# you physically own is the right shape.
#
# `pack.ps1` copies the zip here, and the heartbeat checks how old the newest
# one is. If you do use network storage anyway, remember the file appearing is
# not the same as the file being stored.
#
# folder = D:\Backups\omnius

[omnius]

# WHAT YOU CALL IT. Asked once by install.bat; "Omnius" if you skip.
#
# This is the name it ANSWERS to, not what it is made of: it names the
# orchestrator's own Discord channel (#omnius, #jarvis, #maikel...), the
# terminal tab of a visible desk, and how every desk signs off. The install
# folder, the git repo and the `/omnius` skill keep their name whatever you
# put here - those are machinery, and renaming them would break every path
# and every doc for nothing.
#
# Safe to change at any time. The channel is not renamed for you - do that
# yourself in Discord if you want to, in the app, whenever you like: routing
# is by channel id, so a renamed channel keeps working. (`!reload` is not
# needed either; this is read live.)
# name = Jarvis

# The language Omnius should WRITE to you in. Asked once by install.bat,
# which offers your Windows language as the default.
#
# The model mirrors whatever you write to it without being told, so this is
# not about conversation. It is here because Omnius also generates text of
# its OWN - heartbeat notes, #alerts, !status - and those are English today.
# Recording it means that can follow later, and meanwhile every desk can read
# it in memory\shared\USER.md.
# language = español

# Label for this machine, shown in session claims, Discord channel topics and
# !status. Useful once Omnius runs on more than one PC.
# Leave empty to use the computer's own name.
# machine_name =

# Minutes between heartbeat CHECKS while the watchdog runs. 0 turns it off.
#
# The check itself is cheap - a few file stats and a clock read - and only
# wakes Omnius when it finds something mechanical to do: a stale claim, the
# daily briefing after 07:00, Monday's memory gardening. In practice that is a
# couple of wakes a day, not one every 30 minutes.
# heartbeat_minutes = 30

# Discord transport. 1 uses the Gateway websocket, so a message becomes work
# the moment it is sent. 0 falls back to plain REST polling, which is about
# 3 seconds slower per message.
#
# Leave this alone unless the socket is misbehaving.
# gateway = 1

[browser]

# Which Chrome the desks drive, by the extension's deviceId.
#
# The Chrome extension REFUSES to act while more than one browser is
# connected: it makes the session ask which one, and the answer is a CLICK in
# Chrome on that machine. Over Discord from a phone that click does not exist,
# so the whole browser capability becomes unreachable the moment a second
# profile connects (2026-08-13).
#
# Leave it empty with one browser - nothing is asked. Set it when a second
# appears: ask a desk "list your connected browsers" and paste the deviceId.
# device_id =

# Which Chrome PROFILE a desk launches when Chrome is CLOSED.
#
# Same failure, one level down: `chrome` with no argument and several profiles
# shows the profile picker, and a picker is a click nobody can make from a
# phone (2026-09-04: a desk opened Chrome to read a site, the picker appeared,
# and the run only worked because he happened to be at the machine).
#
# The value is the DIRECTORY name under Chrome's User Data, not the display
# name: "Default", "Profile 2", ... To see both, and which one is configured:
#   python tools\browser\open_chrome.py --list
# Leave it empty only on an install with a single profile.
# profile_directory = Default

[fleet]

# Full path to the Claude Code CLI. Normally leave this alone - it is found on
# PATH, and failing that in the registry's user PATH and the usual install
# locations.
#
# It exists as an escape hatch for the case that cost an hour on 2026-08-14: a
# SERVICE keeps the environment it was born with, so a CLI installed after the
# watchdog started is invisible to it however correct PATH now looks. The right
# fix there is to restart the Omnius Watchdog task; this is for a machine that
# keeps claude somewhere unusual.
# claude_path = C:\Users\you\.local\bin\claude.exe

[bus]

# How often the progress line refreshes while a desk is STILL WORKING on mail
# of yours, in minutes. 0 turns it off.
#
# It is ONE message, edited in place - "still working (6m) - last: Read
# watchdog.py", with the last tool call read from that desk's transcript, so
# you can tell a desk that is thinking from one that is wedged. It stops by
# itself the moment the desk posts anything of its own, because an
# acknowledgement already explains the wait.
#
# A desk deep in a long task and a desk that died look identical from a phone,
# and the advice to reply !restart kills the work it is describing - so that
# advice now appears only when a turn is genuinely silent, parked on a
# permission dialog, or unmeasurable.
# working_notice_minutes = 3

[delegation]

# Desk-to-desk mail (docs\DELEGATION.md): one desk delegates to another by
# addressing an envelope to it; the watchdog routes, mirrors every hop into
# Discord, and enforces the budgets below.

# Forward hops a delegation chain may spend before it must check in with you.
# Replies along the chain are free (unwinding is never starved); only NEW
# desk-to-desk edges count. A chain also has a total-message cap of 4x this,
# which is what stops a reply ping-pong.
# hop_ttl = 3

# Scheduled continuation runs a work loop gets before it must stop and ask
# you whether to continue (consumed by schedule.py's --loop, Phase D). Loops
# never extend themselves; your fresh instruction opens a new loop.
# loop_budget = 5

# --- workflows (docs\DELEGATION.md D11) ---------------------------------------
#
# A workflow is a chain that must keep running across desks and across runs
# until a goal is met. Desk mail that opens one carries a `workflow` block, and
# from then on the DEPTH cap above stops biting on that chain: the three
# settings here are what end it instead. Desk mail with no block behaves
# exactly as it always did.

# Total runs (hops + scheduled loop runs) one workflow may spend before it must
# stop and ask you whether to continue. The desk holding it reports what exists
# to the desk that started the chain, which tells you once. A fresh instruction
# from you opens a NEW workflow with a new budget; workflows never extend
# themselves, for the same reason loops do not.
# workflow_budget = 25

# Wall-clock limit on one workflow, in hours. Whichever runs out first - budget
# or deadline - stops it.
# workflow_deadline_hours = 24

# How long a desk's turn may make NO TOOL CALL before the watchdog restarts it
# by itself, in minutes. 0 turns the recovery off.
#
# A turn that stops without saying so looks exactly like one that is thinking:
# the busy stamp stands, so no headless run starts, the bridge stops nudging,
# and your mail waits behind a turn that will never end. This is the only
# remedy that works, and it is the one you would type yourself - it kills the
# session and starts a fresh run, which then picks up the waiting mail.
#
# A turn parked on a permission ask is NEVER restarted: that is a question
# waiting for you, not a hang, and restarting it would throw away your answer.
# hung_turn_minutes = 20

# How long a workflow may go without a step before you are told it has stalled,
# in hours. The alarm names the desk holding it and the last thing that
# happened, marks the workflow stalled, and repeats at most every 6 hours.
# workflow_stall_hours = 3

# Hold desk mail that CROSSES a project boundary (or targets a tool desk or the
# daybook) until you reply ok/no in Discord.
#
# OFF by default since 2026-09-03. It used to be on, and it asked you to
# approve your own fleet's routine traffic - a project desk escalating to the
# orchestrator was held for an ok, which is the fleet asking permission to talk
# to itself. Turn it on if you want a boundary you have to authorise by hand;
# the hop, depth and message caps apply either way.
#
# Never gated, whatever this is set to: same-project siblings, the
# orchestrator's own delegation, escalation TO the orchestrator, and any reply
# along a chain that already exists.
# cross_project_requires_ok = 0
