# Notes (daybook) — configuration.
#
# Every key is optional and commented out below, showing its default. An
# untouched file behaves exactly like no file at all: uncomment a line to
# change something.
#
# Precedence: environment variable > this file > default. So a one-off
#
#     set NOTES_HOST=0.0.0.0 && python daybook\app.py
#
# still wins over what is written here, without editing anything.

[notes]

# Where the markdown month files live. A relative path is resolved against
# daybook\app.py, not the folder you launch from.
# notes_dir = notes

# Port the server listens on.
# port = 5111

# Bind address. The default, 127.0.0.1, means this machine only — nothing
# else on the network can reach your notes.
#
# Set 0.0.0.0 to serve other devices too, so your phone or another PC can
# open http://<this-machine-ip>:5111.
#
# Understand what that means first: there is NO password. Anyone who can
# reach that address reads every note you have, and the API will take their
# writes, edits and deletes as readily as yours. Only on a network you
# trust. Startup prints a warning whenever this is not 127.0.0.1.
# host = 127.0.0.1
