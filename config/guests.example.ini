# config\guests.ini — people who are NOT you, and may still write to one desk
#
# Copy this file to `guests.ini` and edit it. Without a `guests.ini`, the bus
# behaves exactly as it always did: only your own Discord account is heard.
#
# WHY THIS EXISTS
# A project often has a real-world owner who is not the developer — a client, an
# artist, whoever the work is for. Before 2026-08-12 the watchdog dropped every
# message that was not yours (silently: no envelope, no 👀, no run), so there was
# no way to let that person talk to their own project's desk.
#
# WHAT A GUEST CAN DO
#   - write into the channels this file names, and attach images/audio there
#   - be answered by that desk, in that channel
# WHAT A GUEST CANNOT DO
#   - be heard in ANY other channel (they are dropped, silently, everywhere else)
#   - use control verbs — !status, !screen, !kill, !cron … are yours alone
#   - answer a permission prompt or a takeover question the watchdog asked YOU
#
# The desk sees `from: "<label>"` on the envelope instead of `from: "owner"`, so
# it knows who is talking and can treat their input differently. Choose the
# label with that in mind: it is the name your sessions will see.
#
# THIS FILE IS AN AUTHORISATION LIST, so it fails closed. An entry with no
# `channels`, with a `user_id` that is not a Discord id, or with a label that
# collides with a system sender (owner / omnius / heartbeat / schedule) is
# IGNORED and reported. Run `python tools\omnius_config.py` or ask `!config` in
# Discord to see which entries are actually in effect.
#
# Getting a Discord user id: enable Developer Mode in Discord
# (Settings → Advanced), then right-click the person → Copy User ID.

# [guest.somebody]
# # Shown in !config and used as the envelope's `from` if you omit it.
# name     = Their Name
# user_id  = PASTE-THEIR-18-DIGIT-ID
# # Where they may write. Channel IDS are recommended (exact); channel NAMES
# # also work but collide across projects — every project may have a #web.
# # Space- or comma-separated for more than one.
# channels = PASTE-THE-CHANNEL-ID
# # Free text, for the desk to read. It is documentation, not enforcement:
# # what the guest may DECIDE is a matter for that project's memory.
# scope    = ux
