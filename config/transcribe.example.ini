# Transcription — configuration.
#
# Copy to `transcribe.ini` to use. Every key is optional; an untouched file
# behaves exactly like no file at all.
#
# `transcribe.ini` is GITIGNORED and is excluded from the release build, so
# anything you put here stays on your machine. That is deliberate — the
# vocabulary below is a list of the names that come up in your meetings.

[whisper]

# The language SPOKEN in your recordings, as an ISO code (es, en, de, fr...).
#
# Worth setting, though measured honestly it is a belt rather than the fix:
# on the 2026-08-18 clip the language hint alone changed nothing, and the model
# below is what mattered. It still removes a guess on a few noisy seconds for
# free, which is worth having on a short phone note.
#
# This is the language you SPEAK, which is not necessarily the language Omnius
# writes back to you (that one is config\omnius.ini [omnius] language).
# language = es

# Model size: tiny | base | small | medium | large-v3. Default `base`.
#
# `base` is fast and usually enough. Measured 2026-08-18 on a real four-second
# note: `base` heard "Proderas, cuento 7, mas 7", `small` heard "Prueba, cuanto
# es 7 mas 7?" - correct, for about 3x the time. The owner of this instance
# chose speed knowingly.
#
# SET `small` IF a mishearing would cost you more than ten seconds: a desk acts
# on what it heard. Short, contextless notes are where `base` fails worst;
# longer ones give Whisper much more to work with.
# model = small

# Extra words to seed the decoder with. Whisper guesses proper nouns badly
# unless it has been told they exist: company names, colleagues, products,
# internal systems, the tools you actually talk about. This measurably
# improves them, and costs nothing at runtime.
#
# One line, plain prose, in the language you speak in the recordings. Keep it
# short — a few dozen words. It is a hint, not a dictionary.
#
# vocabulary = Se mencionan Contoso, Fabrikam, Northwind, el portal interno y a Ana, Luis y Marta.
