# AI capabilities — document OCR (built), plus image/video/speech (reserved).
#
# [documents] IS BUILT AND READ: tools\documents\extract.py loads it, and
# filling it in is exactly what turns a scanned PDF or a photographed invoice
# from a picture into text and fields. PDFs that already carry text need no key
# at all - this is the OCR fallback.
#
# IMAGE, VIDEO AND TTS ARE NOT BUILT YET. Those sections reserve the shape so
# the decision is written down before the code, and so `!config` can tell you
# at a glance which ones are switched on. Filling THOSE in does nothing today.
#
# Every capability is OFF until it has both a provider and a key. A missing key
# disables that one capability with a clear message - it never breaks anything
# else, and Omnius runs fine with none of them.
#
# THE KEYS ARE NOT HERE. Each capability names the .env key that holds its
# credential, exactly like mail (config\README.md, rule 2).
#
# ONE KEY COVERS ALL THREE. Google's models do images, video and speech off the
# same GOOGLE_API_KEY - one provider, one secret, one invoice. That is the only
# reason the defaults below are Google; swap any of them freely.

[image]

# Which model. Empty (the default) = image generation is off.
#   nano-banana        Gemini 2.5 Flash Image   ~$0.039/image   <- recommended
#   nano-banana-lite   Gemini 3.1 Flash Lite    ~$0.034/image   cheapest
#   nano-banana-pro    Gemini 3 Pro Image       ~$0.134/image   when it matters
#   gpt-image-2        OpenAI, billed by tokens ~$0.005-0.21
#   qwen-image         ~$0.006/image via fal or Replicate       see below
# provider = nano-banana
#
# WHEN QWEN IS THE RIGHT ANSWER, and it is a narrow when: rendering TEXT
# INSIDE the image - posters, banners, social cards with a headline on them.
# That is its stated strength and the one thing general image models are
# reliably bad at. It is also ~6x cheaper per image.
# The catch is not quality, it is plumbing: it is a SECOND provider, so a
# second key, a second invoice and a second thing that can break - and the
# cheap price is via fal.ai or Replicate, not Alibaba Cloud direct, which
# wants its own cloud account. Qwen Image 3.0 has no published rate card at
# all (limited preview, access by application), so any 3.0 price online is
# invented.
# Adding it later costs exactly what adding it now costs, because a provider
# is an engine behind this same key - so there is no reason to take the second
# invoice before something actually needs text in an image.

# The .env key holding the credential for that provider.
# api_key_env = GOOGLE_API_KEY

# Diagrams, charts and mockups do NOT need any of this - they are drawn as
# SVG/HTML for free. This is for photos and artwork.


[video]

# Empty = video generation is off. Veo prices include audio; the others do not.
#   veo-3.1-fast       $0.10/s (720p) · $0.12 (1080p)   drafting
#   veo-3.1-lite       $0.05/s (720p) · $0.08 (1080p)   cheapest usable
#   veo-3.1-standard   $0.40/s (720p-1080p)             when it matters
# provider = veo-3.1-fast

# api_key_env = GOOGLE_API_KEY

# READ THIS BEFORE ENABLING. An 8-second clip costs $0.40 to $3.20 - video is
# roughly 100x an image. Anything that generates video in a loop, on a
# schedule, or without asking first is a budget accident waiting to happen.
# Cost ceiling per call, in euros. 0 = ask every time (recommended).
# max_cost = 0


[documents]

# Reading PDFs - invoices, contracts, anything scanned.
#
# TRY LOCAL FIRST. A digital PDF (one produced by software, which is most
# invoices) has real text inside it: extracting that is instant, free, private,
# and burns no context. Only a SCANNED or photographed page needs OCR.
#
# The local path needs PyMuPDF (`pip install pymupdf`), which does both jobs:
# pulls text out of digital PDFs, and renders pages to images so the agent can
# read them with vision. No key, no upload, nothing leaves the machine.
#
# An API is worth it for two things and not much else:
#   - genuinely hard scans (photos, bad angles, handwriting)
#   - BATCHES, where you want structured data back instead of the agent
#     reading fifty documents into its context
#
# Empty = local only.
#   mistral      Mistral OCR (console.mistral.ai) - cheap, generous free tier
#                THE ONLY IMPLEMENTED VALUE. Anything else makes every
#                OCR-needing extraction fail with a usage error rather than
#                falling back, and --schema refuses outright.
# provider =

# api_key_env = MISTRAL_API_KEY

# Anything sent to one of these LEAVES THIS MACHINE. An invoice carries a
# supplier, an amount and often a bank account. Keep this off unless the
# document actually needs it - that is the whole reason local comes first.


[tts]

# Empty = text-to-speech is off.
#   google        Google Cloud TTS   good, cheap        <- recommended
#   elevenlabs    best-sounding, more expensive
#   windows       built-in SAPI5     FREE, offline, no key at all
# provider = google

# api_key_env = GOOGLE_API_KEY
#   ...or ELEVENLABS_API_KEY for elevenlabs. `windows` needs no key.

# Windows voices installed here: Helena (es-ES), Zira (en-US). Fine for short
# acknowledgements and alerts, not for anything meant to sound human.
# voice =

# Where a local Piper install lives (the /tts skill's engine). Default when
# unset: C:\ai\piper. Point it somewhere else if you installed Piper elsewhere;
# leave it alone if you have no Piper - the skill then says so instead of
# guessing a path.
# piper_root = C:\ai\piper
