# config\skills.ini - slash commands the owner may pass through to desks.
#
# Copy this file to skills.ini and uncomment `allowed`. When a Discord message
# from YOU starts with /<name> and <name> is on this list, the desk's run is
# told to invoke that skill with the rest of the message as its argument -
# "/watch https://example.com/talk.mp4" runs the watch skill instead of the
# model improvising around the word.
#
# THIS FILE IS AN AUTHORISATION LIST, so it fails closed:
# - no file, no `allowed` key, or an empty value -> NOTHING passes.
# - an unlisted /<name> delivers nothing at all - the watchdog refuses it in
#   the channel and tells you it did.
# - guests never pass slashes, whatever this list says. Their /words are words.
# - /omnius needs no entry: it is the run's own entry point, always accepted.
#
# Names are the skill's folder name: letters, digits, - and _ only.
[skills]
# allowed = status, watch, goal
