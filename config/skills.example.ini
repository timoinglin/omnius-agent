# config\skills.ini - NARROW which slash commands reach your desks.
#
# YOU DO NOT NEED THIS FILE. Since 2026-08-19 every skill this instance has
# installed is available by default: type `/goal ...` or `/status` in a channel
# and the desk runs that skill with the rest of the message as its argument -
# "/watch https://example.com/talk.mp4" runs the watch skill instead of the
# model improvising around the word. Copy this file only to take some of that
# away.
#
# Why the default is open: whoever installs Omnius IS its owner, and this file
# never shipped - so a closed default meant a fresh instance refused its own
# commands with nothing on disk to explain why. The gate that matters is not
# WHICH command, it is WHO is asking, and that one is unchanged and fails
# closed:
# - guests (config\guests.ini) and Telegram invitees (config\telegram.ini)
#   never pass a slash, whatever this file says. Their /words stay words.
# - only the owner's own messages are read as commands at all.
# - /omnius needs no entry either way: it is the run's own entry point.
#
# Names are the skill's folder name: letters, digits, - and _ only.

[skills]

# A list RESTRICTS to exactly these - anything else is refused in the channel
# and says so:
# allowed = status, watch, goal

# `none` (or `off`) closes slash commands entirely:
# allowed = none
