# config\telegram.ini - invite ONE person to ONE channel, from Telegram.
#
# Copy this to telegram.ini to switch the bridge on. With no file, nothing runs
# - the bridge is off by default. There is NOTHING TO RUN once you write it: the
# watchdog notices this file within a minute, starts the bridge, and restarts it
# if it ever dies or goes quiet.
#
# ONE BOT SERVES EVERYBODY. Add one [chat.<label>] block per person, naming the
# channel they reach - nothing else is needed, the channel supplies the desk.
#
# One person reaches ONE channel: name the same person in two blocks and only
# the first (alphabetically, by label) is kept - the other is ignored and
# reported by !config, so you find out rather than wondering why they land
# in the wrong room.
#
# Two people MAY share one channel, but then both need visibility = all. 'own'
# is refused there (and said out loud): the desk's answer to one of them is an
# ordinary message to the other, so 'own' would promise a privacy it cannot
# keep.
#
# What this buys: someone with no Discord account (a client, a colleague) writes
# to a Telegram bot; their message appears in one of your channels, attributed;
# the desk answers as it would for anyone; and the answer goes back to them.
# You always see who wrote - in Discord as "**label** (telegram):", and every
# desk sees `from: "<label>"`, never "owner".
#
# THIS IS AN AUTHORISATION LIST, so it fails closed:
# - no file, no [chat.*] block, or a malformed one -> that person cannot write.
# - a Telegram id not listed here is ignored in silence. No refusal is sent:
#   telling a stranger "you may not write here" draws them a map of the fleet.
# - one person reaches exactly ONE channel. There is no wildcard.
# - they can never use control verbs (!status, !kill...), slash commands, or
#   answer a permission / takeover / 2FA prompt. Those are owner-only in the
#   watchdog itself, not a rule this file could relax.
#
# See docs\WEB.md's sibling section in tools\telegram\README.md for the whole
# contract.

[telegram]

# The .env key holding the bot token from @BotFather. The token is NEVER here -
# config names the key, .env holds the value (config\README.md, rule 2).
# token_env = TELEGRAM_BOT_TOKEN

# Seconds slept between passes. One pass is inbound then outbound, and inbound
# long-polls Telegram for up to 25s first - so on a quiet bot a desk's answer
# reaches Telegram within roughly 25s plus this value. Anything under 2 is read
# as 2.
# mirror_seconds = 5


# --- one block per invited person -------------------------------------------
# The label is what everyone sees: Discord shows it, the desk gets it as
# `from:`, and it appears in transcripts and !trace. Keep it a plain name -
# no dots, not "orchestrator"/"daybook", no -job suffix, or it would collide
# with a desk id and the fleet would mistake a person for one of its own.

# [chat.antonio]

# WHO: their Telegram @handle, which is the one thing you already know about
# them. The first time they write, the bridge pins the numeric id behind that
# handle to this invite - so if they later change handles, or somebody else
# takes the old one, the invite stays with the person you meant.
# telegram_username = their_handle
#
# If they have no @handle, use the numeric id instead. You do not have to look
# it up: let them write to the bot once and Omnius posts the id in #alerts with
# the block to paste.
# telegram_user_id = PASTE-THEIR-TELEGRAM-ID

# WHERE their messages appear: the Discord channel, by id (safest) or #name.
# Names collide across projects; an id never does.
# discord_channel = PASTE-THE-CHANNEL-ID

# WHO answers: usually nothing to say here. Every channel already belongs to a
# desk - #web inside the my-project category IS the my-project.web session -
# and that is the map their message follows, exactly like one you type yourself.
#
# Set this ONLY to override that: to have a different desk answer them, or for
# a channel the fleet maps to nothing (#alerts, #fleet-status). Values look
# like: orchestrator, daybook, tool.<name>, <project>.<component>.
# desk = my-project.web

# How much of that channel they see:
#   all  - everything posted there, including your own messages. A shared room.
#   own  - their own messages and the desk's answers TO THEM (the replies that
#          follow theirs, until somebody else speaks). Your other traffic stays
#          private, and so does the fleet's own chatter in that channel -
#          permission asks, 2FA prompts, delegation mirrors. THIS IS THE DEFAULT.
# visibility = own

# Send real files back to Telegram (photos, documents), rather than naming
# them. Off for now by design: inbound media is rich, outbound is text plus the
# names of any attachments. Flip to 1 when you want the full round trip.
# media_out = 0
