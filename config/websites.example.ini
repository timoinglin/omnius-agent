# config\websites.ini - the sites your desks log into.
#
# Copy this to websites.ini and add a block per site. This file is a REGISTRY,
# not a vault: it holds the url, the account, and the NAME of the .env key that
# holds the password - never the password itself. A Claude desk is denied from
# reading .env, so the password stays out of its context, its transcript and
# its logs. The weblogin tool reads the secret; the model never does.
#
# See docs\WEB.md for the whole shape (login tool + 2FA over Discord).
#
# Each block:
#   url          - where the login lives (https://...)
#   user         - the account/username/email
#   password_env - the KEY in root .env that holds the password
#                  (put WEB_IONOS_PWD=... in .env). `password_key` also works.
#
# A site with a `user` but NO password_env means "I sign in by hand in the
# browser once, then the desk drives the logged-in page" - the Chrome-extension
# path, where no secret is ever scripted. That is the SAFEST option; prefer it.
#
# Optional selectors - only when a site's login form is not guessable by the
# tool's defaults:
#   user_selector    pass_selector    submit_selector
#   otp_selector     - the 2FA/one-time-code field
#   success_selector - something visible ONLY when logged in (proves it worked)
# WRITE ID SELECTORS AS [id=foo], NOT #foo. This is an ini file and `#` starts
# an inline comment, so `pass_selector = #password` silently becomes an EMPTY
# setting - the tool then falls back to guessing and you debug the wrong thing
# (2026-09-04). `input[id=password]` means the same to the browser and survives.
#
#   next_selector    - TWO-STEP logins (Zoho, Google, Microsoft): the button
#                      that walks from the email page to the password page.
#                      Leave it out and the tool presses Enter on the email
#                      field, which is usually enough.
#
# A warning worth reading before you register a work account: if the site hands
# its login to a corporate identity provider (you type your email and land on
# login.microsoftonline.com or accounts.google.com), scripted login is the
# WRONG tool. The password that matters is not the site's, the second factor is
# usually a push to a phone rather than six digits, and corporate policy often
# blocks automated browsers outright. Those sites are sign-in-by-hand sites:
# omit password_env and drive them with the Chrome extension (2026-09-04, Zoho
# People behind Entra ID).

# [ionos]
# url = https://www.ionos.es
# user = antonio@example.com
# password_env = WEB_IONOS_PWD

# [example-with-selectors]
# url = https://app.example.com/login
# user = me@example.com
# password_env = WEB_EXAMPLE_PWD
# user_selector = input#email
# pass_selector = input#password
# submit_selector = button[type=submit]
# otp_selector = input[name=otp]
# success_selector = [data-testid=account-menu]
