# Email accounts.
#
# Copy to email.ini and add one [account.<label>] block per mailbox. The label
# is yours: it names the Discord channel for that account (#email-work) and is
# how you refer to it ("send from work"). Keep it kebab-case, no spaces.
#
# Precedence: environment variable > this file > default.

[email]

# Which account is used when you do not name one.
# default = work

# How many messages a fetch returns at most, so one command can never dump a
# thousand mails into a Discord channel.
# max_fetch = 25


# --- one block per mailbox ----------------------------------------------------
#
# THE PASSWORD IS NEVER WRITTEN HERE. `password_env` names the key in the root
# .env that holds it. That is what keeps this file readable and shareable while
# the credential stays in one gitignored place (config\README.md, rule 2).
#
# For Zoho and Gmail: use an APP PASSWORD, not your login password. Those
# accounts have 2FA and will reject the real one.
#
# SMTP is encrypted two incompatible ways and providers split on it: implicit
# TLS on port 465 (Zoho, Gmail) versus STARTTLS on 587 (Microsoft 365). The
# port decides it automatically; smtp_security only exists to override an
# unusual provider.
#
# MICROSOFT 365 / Exchange Online does NOT use this block at all - it needs
# `provider = graph`, further down. Do not spend an evening on IMAP here:
# Microsoft turned OFF password ("basic") authentication for IMAP and POP in
# October 2022 and no administrator can restore it. A correct password is
# refused in a way that looks exactly like a wrong one. That the account works
# in the Outlook app proves nothing - that app signs in with OAuth behind a
# Microsoft login page, not with IMAP. Measured again 2026-08-17 with the real
# password: IMAP answers "AUTHENTICATE failed", SMTP answers "535 5.7.139
# SmtpClientAuthentication is disabled for the Tenant".
#
# Don't know your provider? Look up your domain's MX record; it names whoever
# actually handles the mail.

# [account.work]
# imap_host = imap.zoho.eu
# imap_port = 993
# smtp_host = smtp.zoho.eu
# smtp_port = 465
# user      = you@example.com
# password_env = EMAIL_WORK_PASSWORD
#
# Display name on messages you send. Defaults to the user above.
# from_name = Your Name
#
# Folder to read. Defaults to INBOX.
# folder = INBOX

# [account.personal]
# imap_host = imap.gmail.com
# imap_port = 993
# smtp_host = smtp.gmail.com
# smtp_port = 465
# user      = you.personal@example.com
# password_env = EMAIL_PERSONAL_PASSWORD


# --- Microsoft 365 / Exchange Online: provider = graph -------------------------
#
# The ONLY path that works for a Microsoft mailbox. No hosts and no ports: the
# Graph API is one HTTPS endpoint. `token_env` names the .env key holding a
# REFRESH token, not a password.
#
# Register a public client app once per TENANT (not per domain - check the
# `issuer` at
# https://login.microsoftonline.com/<domain>/v2.0/.well-known/openid-configuration;
# same GUID means one app covers them all). Delegated permissions only:
# Mail.Read, Mail.Send, offline_access - so it can only ever reach the mailbox
# of whoever signed in, as that user.
#
# Then, per MAILBOX (a token is per mailbox, never per tenant):
#   python tools\email\authorize.py --account <label> --write
# It prints a device code to enter at https://login.microsoft.com/device and
# writes the refresh token into .env itself.
#
# If sign-in ends at "Admin approval required", your tenant forbids users from
# consenting to apps. An admin approves it in one click:
#   https://login.microsoftonline.com/<tenant_id>/adminconsent?client_id=<client_id>

# [account.work-m365]
# provider  = graph
# tenant_id = 00000000-0000-0000-0000-000000000000
# client_id = 00000000-0000-0000-0000-000000000000
# user      = you@example.com
# from_name = Your Name
# folder    = inbox
# token_env = EMAIL_WORK_M365_TOKEN
